directories:
  output: dist-mongo-verify
  buildResources: public
appId: com.pharmadesk.app
productName: Pharma Desc
asar: true
files:
  - filter:
      - electron/**/*
      - package.json
      - public/**/*
      - '!**/*.map'
      - '!**/*.ts'
      - '!**/*.md'
      - '!**/*.test.*'
      - '!**/*.spec.*'
      - '!**/coverage/**'
      - '!**/docs/**'
      - '!**/.git/**'
      - '!**/.github/**'
      - '!**/.vscode/**'
      - '!**/.DS_Store'
extraResources:
  - from: .next/standalone/server.js
    to: app/server.js
  - from: .next/standalone/package.json
    to: app/package.json
  - from: .next/standalone/.next
    to: app/.next
  - from: .next/standalone/public
    to: app/public
  - from: .next/standalone/node_modules
    to: app/node_modules
    filter:
      - '**/*'
      - '**/.*'
  - from: node_modules/.prisma/client
    to: app/node_modules/.prisma/client
    filter:
      - '*.node'
      - '*.dll'
  - from: prisma/schema.prisma
    to: app/prisma/schema.prisma
win:
  target:
    - nsis
  icon: public/icon.ico
  artifactName: Pharma Desc Setup.${ext}
  executableName: PharmaDesc
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
  installerHeaderIcon: public/icon.ico
  shortcutName: Pharma Desc
  uninstallDisplayName: Pharma Desc
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false
publish:
  - provider: github
    owner: nageshpatidar02-coder
    repo: pharmacy-management
    releaseType: release
electronVersion: 44.5.0
